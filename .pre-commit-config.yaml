---
# Hooks to use in this repository
repos:
  ########################################
  # Javascript Beautifiers and Linters
  ########################################
  # Looks like a great tool, but it errors because it isn't installed
  # - repo: https://github.com/biomejs/pre-commit
  #   rev: v0.6.1
  #   hooks:
  #     - id: biome-check
  - repo: https://github.com/standard/standard
    rev: v17.1.2
    hooks:
      - id: standard
        args: [--fix, --no-ignore]
        # --no-ignore makes standard lint everything it is handed, including
        # third-party minified bundles we do not maintain. It has already
        # reformatted jquery.scrollex.min.js and jquery.scrolly.min.js in
        # place. Keep vendor libraries out of its reach so upgrading one is a
        # clean file swap rather than a swap plus a reformat.
        exclude: |
          (?x)^(
            assets/js/jquery\.min\.js|
            assets/js/jquery\.scrollex\.min\.js|
            assets/js/jquery\.scrolly\.min\.js|
            assets/js/skel\.min\.js
          )$

  ########################################
  # Linters to validate beautifiers output
  ########################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
