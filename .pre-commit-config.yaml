---
# Runs from a project-local Python venv (.venv, gitignored) — see
# CONTRIBUTING.md for setup. Full linting (markdown/CSS/TS/etc. style rules)
# lives in MegaLinter (CI, issue #23); these hooks are the fast local subset
# plus secret scanning, so problems are caught before they're even pushed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # devcontainer.json is JSONC (comments + trailing commas allowed by
        # the devcontainer spec); check-json only understands strict JSON.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: 058f44e47719e80d8f1e597a235310b60e937860  # v10.2.0
    hooks:
      - id: cspell

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks-docker
        entry: zricethezav/gitleaks:v8.30.1 git --pre-commit --redact --staged --verbose
