---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github_actions"
      - "chore"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain npm dependencies (package.json at the repo root, added by the
  # Astro scaffold — see docs/overhaul/architecture.md).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "chore"
    groups:
      npm:
        patterns:
          - "*"

  # Maintain devcontainer feature versions
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
    groups:
      devcontainer:
        patterns:
          - "*"
