# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Deploys happen from v* tags and nowhere else, matching main's tag-gated
  # release.yml - a push to master runs mega-linter.yml, css.yml, codeql.yml
  # and scorecard.yml but does not publish. Same "no branch push, no
  # schedule" rule release.yml documents, so a v1 fix can't go live before
  # it's reviewed and deliberately tagged.
  push:
    tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site artifact
        # Allowlist only what the site actually serves - repo tooling,
        # lint/CI config, sass sources and dotfiles must never be published.
        run: |
          set -euo pipefail
          mkdir -p _site/assets/css

          cp index.html engineer.html engineer-devops.html engineer-ai.html \
             engineer-firmware.html leader.html photographer.html prod_tech.html \
             bellringing.html cars.html coffee.html travel.html \
             terms-and-conditions.html under_construction.html \
             CNAME google519c92453ea72bf0.html _site/

          cp assets/css/main.css assets/css/font-awesome.min.css _site/assets/css/
          cp -r assets/fonts assets/js _site/assets/

          cp -r images _site/

          # Kept in the repo for reference but never linked from any page -
          # JPEGs_FBK/ (compressed) and gallery fulls/ (via thumbs/) are what
          # the site actually serves. Don't publish full-res originals.
          rm -rf _site/images/will/JPEGs
          rm -rf _site/images/gallery/photographer/product
      - name: Setup Node
        # No `cache: npm` here, and package-manager-cache explicitly disabled:
        # this job builds the artifact that gets deployed to production, and
        # a poisoned npm cache would poison that artifact. setup-node v7
        # auto-enables its package-manager-cache heuristically, so omitting
        # `cache: npm` alone isn't enough to opt out. Caching is fine in
        # CI-only workflows, not this one.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Optimize images
        run: node scripts/optimize-images.mjs _site/images
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
