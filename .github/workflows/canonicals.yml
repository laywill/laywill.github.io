---
name: Canonicals

# static.yml's cp allowlist, sitemap.xml, each page's rel=canonical and the
# sitemap.html and llms.txt indexes must agree (#146, #165). The pre-commit
# hook is the fast local check; this is the backstop for commits made with
# --no-verify or through the web UI.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: canonicals-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: allowlist, sitemap.xml, canonicals and indexes agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Check canonicals and page indexes against the allowlist
        run: npm run check-canonicals
