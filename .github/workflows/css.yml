---
name: CSS

# assets/css/main.css is generated from assets/sass/ and is the file the site
# actually loads. Nothing stops someone editing the generated file directly, or
# editing the Sass and forgetting to rebuild - and either way the two silently
# stop describing the same stylesheet. This job rebuilds from source and fails
# if the result differs from what is committed.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: main.css matches assets/sass/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild main.css and compare
        run: npm run css:check
