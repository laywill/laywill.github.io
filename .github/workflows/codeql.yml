---
name: CodeQL

# Trigger CodeQL analysis on pushes/PRs to main and on a weekly schedule so
# alerts surface even without recent code changes.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

  # Also callable as the SAST gate of the release pipeline (release.yml), so a
  # tagged release is analysed by this exact configuration rather than a copy
  # of it that can drift.
  workflow_call:

# The literal prefix matters: github.workflow resolves to the *caller's*
# workflow name when this runs as a called workflow, so without it every
# workflow release.yml calls would share one group and cancel its siblings.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # No JS/TS source exists yet (Astro scaffolding is issue #24) — CodeQL
        # fails the build if a selected language has no matching files. Until
        # #24 lands, `actions` (this repo's GitHub Actions workflows) is the
        # only supported language with content to analyze. Switch/add
        # javascript-typescript once the Astro project exists. See
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning#changing-the-languages-that-are-analyzed
        # for the full list of supported identifiers.
        language:
          - actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
