---
name: Scorecard

# OSSF Scorecard supply-chain security analysis. Runs on push to main (the
# Branch-Protection check needs push events to evaluate) and weekly so
# scores stay current even without repo activity. Deliberately not run on
# pull_request: Scorecard's own docs advise against PR triggers because of
# the elevated token permissions the action needs.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "20 3 * * 3"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publishes badge-eligible results to the public
          # Scorecard API (https://api.securityscorecards.dev). See PR
          # description for the rationale.
          publish_results: true

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
