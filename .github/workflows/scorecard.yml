---
name: Scorecard

# OSSF Scorecard supply-chain security analysis. Runs on push to master (the
# Branch-Protection check needs push events to evaluate) and weekly so
# scores stay current even without repo activity. Deliberately not run on
# pull_request: Scorecard's own docs advise against PR triggers because of
# the elevated token permissions the action needs.
on:
  push:
    branches:
      - master
  schedule:
    - cron: "20 3 * * 3"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publishes badge-eligible results to the public
          # Scorecard API (https://api.securityscorecards.dev). See PR
          # description for the rationale.
          publish_results: true

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
