---
# Set update schedule for GitHub Actions

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    labels:
      - "ci"
      - "chore"
    groups:
      # init/autobuild/analyze/upload-sarif share state via the config file
      # init writes and refuse to run at mixed versions, so a bump of one
      # subpath alone always fails CodeQL. Move them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # Maintain dependencies for Devcontainer dependencies
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
  # Maintain npm devDependencies (sass, sharp and their transitive deps)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "chore"
    ignore:
      # The sass pin must match additional_dependencies in
      # .pre-commit-config.yaml, which Dependabot can't edit. Bump both by hand.
      - dependency-name: "sass"
    groups:
      # osv-scanner fails CI on any open advisory, so a PR fixing one advisory
      # stays red while another is unfixed (#194). One PR fixes them all.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm:
        applies-to: version-updates
        patterns:
          - "*"
