---
# MegaLinter Configuration
# https://megalinter.io/
#
# This repo is a static Astro/TypeScript site (see docs/overhaul/architecture.md)
# with Markdown content collections, YAML/JSON config, and plain CSS — no
# Python, Go, Java, PHP, Ruby, Rust, etc. source. Rather than rely on
# MegaLinter's full auto-detected linter set, ENABLE below is scoped to the
# languages/tools this repo actually uses, so we don't install or run
# linters for ecosystems that will never have matching files.
#
# NOTE: MegaLinter has no dedicated Astro (.astro) descriptor as of writing.
# .astro files are HTML-with-frontmatter+JS/TS; they get partial coverage
# from the HTML and JAVASCRIPT/TYPESCRIPT descriptors below, but no linter
# here understands Astro's component syntax natively. Revisit if/when
# MegaLinter (or a standalone `astro check`, run separately in CI per
# architecture.md) adds first-class support.

APPLY_FIXES: yes
DISABLE_ERRORS: false
SHOW_ELAPSED_TIME: true
PARALLEL: true
FILEIO_REPORTER: false

# Only run linters for languages/tools actually used in this repo.
ENABLE:
  - ACTION       # GitHub Actions workflow linting (actionlint)
  - CSS          # Plain CSS (no framework, per architecture.md)
  - EDITORCONFIG # Enforces .editorconfig rules
  - HTML         # Astro compiles to HTML; also covers .astro as best-effort HTML
  - JAVASCRIPT
  - JSON
  - MARKDOWN     # Content collections + docs/overhaul/*.md
  - REPOSITORY   # Secret scanning (gitleaks) and repo-level checks
  - SPELL        # cspell + lychee link checking
  - TYPESCRIPT   # Strict TS per architecture.md
  - YAML         # GitHub Actions, dependabot, mega-linter/yamllint configs

DISABLE_LINTERS:
  - JSON_PRETTIER   # Conflicts with JSON_JSONLINT's own formatting opinions
  - YAML_PRETTIER    # Conflicts with YAML_YAMLLINT
  - REPOSITORY_CHECKOV       # IaC scanner - no Terraform/CloudFormation/etc. here
  - REPOSITORY_KICS          # IaC scanner - same reason
  - REPOSITORY_TRIVY         # Container/IaC scanner - no Dockerfiles/containers here
  - REPOSITORY_DEVSKIM       # Overlaps with CodeQL (issue #23) + gitleaks

# Not worried if Lychee finds dead links (transient network issues in CI);
# `astro build` + a dedicated link-check step (issue #23) catch real breaks.
SPELL_LYCHEE_DISABLE_ERRORS: true

# Exclude GitHub-relative links that only resolve correctly when rendered on
# GitHub (e.g. SECURITY.md's "../../issues/new/choose" link), since Lychee
# checks them against the local filesystem instead.
SPELL_LYCHEE_ARGUMENTS: "--exclude 'issues/new/choose'"

# JSON Configuration
# --bom               Ignore the leading UTF-8 byte-order mark
# --comments          Allow comments in JSON files (used in devcontainer.json)
# --trailing-newline  Ensure a trailing newline at the end of JSON files
# --trailing-commas   Allow trailing commas in JSON files
JSON_JSONLINT_ARGUMENTS: "--comments --trailing-newline --trailing-commas"

# CSpell Config
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: (\.cspell\.json|\.gitignore)

# EditorConfig Checker Config
# - LICENSE is the canonical license text copied verbatim; shouldn't be
#   reformatted to satisfy indent-size rules.
# - *.md: editorconfig-checker's indent-size rule isn't Markdown-aware — it
#   flags ordered-list continuation lines (3-space, aligning under "1. ") and
#   intentionally-aligned ASCII diagrams inside fenced code blocks (see
#   docs/overhaul/architecture.md, docs/overhaul/content-audit.md) as
#   indentation errors. markdownlint (enabled above) already governs Markdown
#   formatting, so Markdown is excluded here rather than mangling those.
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (LICENSE|\.md$)

# Filter Configuration
# Anchored on directory boundaries so `.git/` is excluded without also
# matching `.github/` as a substring (see issue #48).
FILTER_REGEX_EXCLUDE: (^|/)(\.git|\.venv|\.pytest_cache|\.vscode|node_modules|dist|\.astro)/
